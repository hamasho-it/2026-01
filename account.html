<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noope - アカウント</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:30</span>
      <div class="status-bar-icons">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- Header -->
    <div class="app-header">
      <h1>マイページ</h1>
      <div class="header-actions">
        <!-- Notification Button -->
        <button class="icon-btn" onclick="handleNotification()" aria-label="通知オン・オフ">
          <div class="img-box icon-box"><img src="./images/icon-bell.png" alt="通知"></div>
        </button>
        <!-- Settings Button (Hamburger Icon) -->
        <a href="./settings.html" class="icon-btn" aria-label="設定">
          <div class="img-box icon-box"><img src="./images/icon-menu.png" alt="設定"></div>
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="app-content">
      <!-- Profile Header Area -->
      <div class="profile-header">
        <div class="avatar-lg">
          <img src="./images/user-avatar.png" alt="ユーザーアイコン">
        </div>
        <div class="user-name">利用者A</div>
        <div class="user-email">sample_user_a@example.com</div>
      </div>

      <!-- User Detail Card -->
      <div class="card">
        <h3 style="font-size: 14px; color: var(--text-secondary);">ユーザーの詳細</h3>
        <p style="font-size: 14px; line-height: 1.6;">
          サンプル県サンプル町にて果樹園を経営しています。トラクターのシェアリング可能です。
        </p>
      </div>

      <!-- Action Area -->
      <div style="margin-top: 10px;">
        <button class="btn-secondary btn-danger" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">
        <div class="img-box icon-box"><img src="./images/icon-home.png" alt="ホーム"></div>
        <span>ホーム</span>
      </a>
      <a href="./search.html" class="nav-item">
        <div class="img-box icon-box"><img src="./images/icon-search.png" alt="検索"></div>
        <span>検索</span>
      </a>
      <a href="./job-create.html" class="nav-item">
        <div class="img-box icon-box"><img src="./images/icon-create.png" alt="仕事依頼"></div>
        <span>仕事依頼</span>
      </a>
      <a href="./account.html" class="nav-item active">
        <div class="img-box icon-box"><img src="./images/icon-profile.png" alt="プロフィール"></div>
        <span>プロフィール</span>
      </a>
    </nav>
  </div>
  <script src="./script.js"></script>
</body>
</html>
